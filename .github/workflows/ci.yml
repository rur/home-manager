name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check
      - run: nix build '.#homeConfigurations."ruaidhridevery@chromebook".activationPackage'
      - run: nix build '.#homeConfigurations."operator@agent-host".activationPackage'

  build-darwin:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build '.#homeConfigurations."ruaidhridevery@macbookpro".activationPackage'
